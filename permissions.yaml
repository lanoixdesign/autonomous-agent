# permissions.yaml — YOU decide what the agent may do.
# Modes: allow (runs), ask (asks you in the terminal), deny (refused).
# Without a terminal, "ask" means refused.
# --yolo turns "ask" into "allow" EXCEPT for send and spend: for those, only what
# you write here counts.

defaults:
  read: allow       # read files in the workspace, recall memory, load skills
  write: ask        # create / edit files
  execute: ask      # shell commands
  network: ask      # web fetch / search, GitHub reads
  send: ask         # actions visible to others (GitHub issues, comments, PRs...)
  spend: deny       # anything that costs money
  delegate: ask     # launch sub-agents (spawn_agent); they never get more rights than this file

# Per-tool overrides (take precedence over the category)
tools:
  memory_write: allow
  memory_forget: ask
  # shell: deny
  # github_write: deny

# Paths are relative to the workspace. deny always wins.
# If paths.allow is non-empty, every other path is refused.
paths:
  allow: []
  deny:
    - ".env"
    - "**/.env"
    - ".env.*"
    - "**/*.pem"
    - "**/*.key"
    - "**/id_rsa*"
    - "**/id_ed25519*"
    - ".git/**"
    - ".agent/**"     # memory + audit: only through the memory tools

# Shell commands (fnmatch patterns on the whole command line).
# allow: commands that skip the confirmation (when execute is "ask").
# deny: always refused. This list is a seatbelt, NOT a sandbox.
commands:
  allow:
    - "ls*"
    - "pwd"
    - "git status*"
    - "git diff*"
    - "git log*"
    - "python -m pytest*"
  deny:
    - "sudo *"
    - "su *"
    - "*rm -rf /*"
    - "*rm -rf ~*"
    - "*mkfs*"
    - "*dd if=*"
    - "*:(){*"
    - "*curl *|*sh*"
    - "*wget *|*sh*"
    - "*chmod -R 777 /*"
    - "*shutdown*"
    - "*reboot*"
    - "*git push*--force*"

# Domains for web_fetch / web_search / GitHub tools.
# allow: skip the confirmation (when network is "ask"). deny: always refused.
domains:
  allow:
    - "api.github.com"
  deny: []

# IDC mode (optional, OFF by default) — finite deliberation, append-only commitments, forced collapse.
# See the README ("IDC mode"). Also: --idc / --no-idc, AGENT_IDC=1, the IDC switch in the chat.
# idc:
#   enabled: false
#   vitality: 100            # per user message
#   step_cost: 4             # per model call
#   tool_cost: 3             # per tool call
#   token_cost: 0.5          # per 1000 tokens
#   collapse_threshold: 20   # at or below: answer now, without tools
#   stall_limit: 3           # tool calls in a row without new information -> answer now
#   commit_cost: 1           # supported commitment
#   unknown_cost: 0.5        # "I don't know" (must stay cheaper than unsupported_cost)
#   unsupported_cost: 15     # claim whose evidence was not observed
#   revise_cost: 25          # correcting an earlier commitment
#   allow_revise: true       # false: commitments can never be corrected
#   child_share: 0.5         # a sub-agent gets at most this share of the vitality left

name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        yaml: ["with-pyyaml", "stdlib-only"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - if: matrix.yaml == 'with-pyyaml'
        run: pip install pyyaml
      - run: python -m pytest -q
      - name: End-to-end run with the offline mock backend
        run: python -m agent run "List the files" --provider mock --offline --workspace . --state-dir /tmp/agent-state

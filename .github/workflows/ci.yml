name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        yaml: ["with-pyyaml", "stdlib-only"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest==9.2.0
      - if: matrix.yaml == 'with-pyyaml'
        run: pip install pyyaml==6.0.3
      - run: python -m pytest -q
      - name: End-to-end run with the offline mock backend
        run: python -m agent run "List the files" --provider mock --offline --workspace . --state-dir /tmp/agent-state

  desktop-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller==6.22.3 certifi==2026.10.23
      - run: python -m PyInstaller --noconfirm --clean packaging/autonomous-agent.spec
      - name: Smoke test of the built app (start, /health, stop)
        run: packaging/smoke.sh dist/AutonomousAgent
